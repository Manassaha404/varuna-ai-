name: Build, Push, Deploy

on:
  push:
    branches: [main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, socket]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://varuna.manasx.online
            NEXT_PUBLIC_SOCKET_URL=https://varuna.manasx.online
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/varuna-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/varuna-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=varuna-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=varuna-${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "~/varuna"

      - name: Write env files on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p ~/varuna/env

            write_env_file() {
              local target="$1"
              local content="$2"
              # Write to a temp file first so a bad write never clobbers the last-good file
              local tmp
              tmp="$(mktemp)"
              printf '%s\n' "$content" > "$tmp"

              # Validate: every non-empty, non-comment line must look like KEY=value
              if grep -vE '^\s*(#.*)?$' "$tmp" | grep -vE '^[A-Za-z_][A-Za-z0-9_]*=' > /dev/null; then
                echo "ERROR: $target contains a line that is not KEY=value:"
                grep -vE '^\s*(#.*)?$' "$tmp" | grep -vE '^[A-Za-z_][A-Za-z0-9_]*=' || true
                rm -f "$tmp"
                exit 1
              fi

              mv "$tmp" "$target"
              chmod 600 "$target"
            }

            write_env_file ~/varuna/env/api.env     "${{ secrets.API_ENV_FILE }}"
            write_env_file ~/varuna/env/socket.env  "${{ secrets.SOCKET_ENV_FILE }}"
            write_env_file ~/varuna/env/web.env     "${{ secrets.WEB_ENV_FILE }}"
            write_env_file ~/varuna/env/inngest.env "${{ secrets.INNGEST_ENV_FILE }}"

            echo "Env files written and validated successfully."

      - name: Install Docker on server (if needed)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            
            # Check if Docker is installed
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose
              sudo usermod -aG docker $USER
              echo "Docker installed successfully."
            else
              echo "Docker already installed: $(docker --version)"
            fi
            
            # Verify Docker Compose
            if ! command -v docker-compose &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            
            echo "Docker Compose version: $(docker-compose --version)"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/varuna

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export TAG=${{ github.sha }}

            # Ensure DOCKERHUB_USERNAME is persisted in .env for future manual runs
            if ! grep -q "^DOCKERHUB_USERNAME=" .env 2>/dev/null; then
              echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            fi

            # Login to Docker Hub on the server
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Validate compose + env files BEFORE touching anything running
            echo "Validating docker compose config..."
            docker compose config > /dev/null

            echo "Pulling latest images..."
            docker compose pull

            echo "Recreating containers..."
            docker compose up -d --force-recreate

            # Wait for containers to settle
            sleep 5

            echo "Running database migrations..."
            docker compose exec -T api pnpm --filter @repo/database run db:generate
            docker compose exec -T api pnpm --filter @repo/database run db:migrate

            echo "Checking container health..."
            docker compose ps

            if [ -n "$(docker compose ps -q --status=exited)" ]; then
              echo "ERROR: One or more containers exited after deploy!"
              docker compose ps
              docker compose logs --tail=50
              exit 1
            fi

            echo "Deploy healthy. Cleaning up dangling images..."
            docker image prune -f

            echo "Deploy complete."
